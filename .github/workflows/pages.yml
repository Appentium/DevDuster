name: Deploy site

on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshots/**, App/Assets.xcassets/AppIcon.appiconset/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          cp -r docs/screenshots site/screenshots
          cp App/Assets.xcassets/AppIcon.appiconset/icon_256@2x.png site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
