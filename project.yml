name: DevDuster
options:
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4GAP4FSZZS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    LM_SKIP_METADATA_EXTRACTION: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
packages:
  DusterCore:
    path: Packages/DusterCore
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  DevDuster:
    type: application
    platform: macOS
    sources:
      - App
      - path: Helper/com.appentium.devduster.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appentium.devduster
        PRODUCT_NAME: DevDuster
        EXECUTABLE_NAME: DevDusterApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DevDuster
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://devduster.com/appcast.xml
        SUPublicEDKey: NWOGLMydurcDJDBLKU0un0FyKKo+2ERAtbUtkLEZJEM=
        SUEnableAutomaticChecks: true
    dependencies:
      - package: DusterCore
      - package: Sparkle
      - target: DusterHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: DusterCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
  DusterHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appentium.devduster.helper
        PRODUCT_NAME: DusterHelper
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    dependencies:
      - package: DusterCore
  DusterCLI:
    type: tool
    platform: macOS
    sources: [CLI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appentium.devduster.cli
        PRODUCT_NAME: duster
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    dependencies:
      - package: DusterCore
      - package: swift-argument-parser
        product: ArgumentParser
schemes:
  DevDuster:
    build:
      targets:
        DevDuster: all
    run:
      config: Debug
